<!DOCTPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <title>C'mon dude, hurry up! What's the matter?</title>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
    }
    body {
      background: black;
      color: white;
      /* yeah */
      color-scheme: only light;

      display: flex;
      flex-flow: column nowrap;
      justify-content: center;
      align-items: center;
    }
    img {
      image-rendering: optimizeSpeed;
      image-rendering: pixelated;
    }

    #veil {
      flex: 0 0;
      flex-basis: 25%;
      min-height: 0;
    }

    .veil * {
      height: 100%;
      object-fit: contain;
    }
    .veil img {
      cursor: pointer;
    }
    .veil:not([data-revealed]) > .img-hidden {
      display: none;
    }
    .veil[data-revealed] > .img-cover {
      display: none;
    }
    /* .veil[data-revealed] img {
      cursor: default;
    } */
  </style>

  <style>
    .img-hidden {
      display: grid;
      place-items: center;
    }
    .img-hidden > img {
      grid-column: 1;
      grid-row: 1;
    }

    #splat {
      z-index: 1;
    }
    #explosion {
      z-index: 2;
      height: 125%;
      object-fit: fill;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="veil" id="veil">
    <img class="img-cover" src="ralsei.png" alt="Ralsei, desaturated and without his signature smile">

    <div class="img-hidden">
      <img id="splat" src="ralsei-pertified.png" loading="eager" alt="Ralsei, pertified and splatted">
      <img id="explosion" src="explosion.gif" loading="eager" alt="Crappy realistic explosion" tabindex="-1">
    </div>
  </div>

  <audio id="reveal-sound" preload>
    <source type="audio/wav" src="explosion.wav"/>
  </audio>

  <script>
    var veil = document.getElementById("veil");
    var revealSound = document.getElementById("reveal-sound");
    var explosion = document.getElementById("explosion");

    function onClick(e) {
      e.preventDefault();

      veil.dataset.revealed = true;
      document.title = "Ralsei!?";

      revealSound.currentTime = 0;
      revealSound.play();
      explosion.src = explosion.src;

      // veil.removeEventListener(veil, onClick);
    }

    veil.addEventListener("click", onClick);
  </script>
</body>

</html>
