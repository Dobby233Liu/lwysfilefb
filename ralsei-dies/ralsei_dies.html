<!DOCTPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <title>C'mon dude, hurry up! What's the holdup?</title>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
    }
    img {
      image-rendering: optimizeSpeed;
      image-rendering: pixelated;
    }

    body {
      background: black;
      color: white;
      /* yeah */
      color-scheme: only light;

      display: flex;
      flex-flow: column nowrap;
      justify-content: center;
      align-items: center;
    }

    #veil {
      flex: 0 0;
      flex-basis: 25%;
      min-height: 0;
    }

    .veil * {
      height: 100%;
      object-fit: contain;
    }
    .veil /*:not([data-revealed])*/ img {
      cursor: pointer;
    }
    .veil:not([data-revealed]) > .veil-hidden {
      display: none;
    }
    .veil[data-revealed] > .veil-cover {
      display: none;
    }
  </style>

  <style>
    .emboss {
      display: grid;
      place-items: center;
    }
    .emboss > * {
      grid-column: 1;
      grid-row: 1;
    }

    #explosion {
      transform: scale(1.25);
      object-fit: fill;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="veil" id="veil">
    <img class="veil-cover" src="ralsei.png" alt="Ralsei, desaturated and without his signature smile">

    <div class="veil-hidden emboss">
      <img id="splat" src="ralsei-pertified.png" loading="eager" alt="Ralsei, petrified and splatted">
      <img id="explosion" src="explosion.gif" loading="eager" alt="Crappy realistic explosion" tabindex="-1" aria-hidden="true">
    </div>
  </div>

  <audio id="veil-reveal-sound" preload>
    <source type="audio/wav" src="explosion.wav" />
  </audio>

  <script>
    var veil = document.getElementById("veil");
    var revealSound = document.getElementById("veil-reveal-sound");

    var explosion = document.getElementById("explosion");

    function onClick(e) {
      e.preventDefault();
      // veil.removeEventListener(veil, onClick);

      document.title = "Ralsei!?";
      veil.dataset.revealed = true;

      if (revealSound) {
        revealSound.currentTime = 0;
        revealSound.play();
      }

      explosion.src = explosion.src;
    }

    veil.addEventListener("click", onClick);
  </script>
</body>

</html>
